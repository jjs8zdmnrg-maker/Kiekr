  const mid = idx > 8 ? cx : cx;
  return `<svg class="vres venn" viewBox="0 0 320 190" role="img" aria-label="Gemeinsamkeits-Index ${idx} von 100">
    <circle class="ca" cx="${ax}" cy="84" r="${r}" style="--dx:${(d / 2 + 30).toFixed(0)}"/>
    <circle class="cb" cx="${bx}" cy="84" r="${r}" style="--dx:${(d / 2 + 30).toFixed(0)}"/>
    <text class="num" x="${mid}" y="100" text-anchor="middle">${idx}</text>
    <text class="nm" x="${ax - r + 6}" y="178">${esc(nA)}</text><text class="nm" x="${bx + r - 6}" y="178" text-anchor="end">${esc(nB)}</text>
  </svg>`;
}
function renderResult(){
  const d = state.result, an = analysis(d), tone = toneOf(d.rel);
  const A = esc(d.nameA), B = esc(d.nameB);
  const lv = t => LEVEL[t.level];
  // Index-Ring
  const R = 52, C = 2 * Math.PI * R, off = C * (1 - an.index / 100);
  const ring = `<svg class="ring" viewBox="0 0 128 128" aria-hidden="true"><circle cx="64" cy="64" r="${R}" class="ring-bg"/><circle cx="64" cy="64" r="${R}" class="ring-fg" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 64 64)"/></svg>`;
  const parts = an.parts.map(p => `<li><div class="bar-top"><span>${p.key}</span><b>${Math.round(p.v * 100)} %</b></div><div class="bar"><i style="width:${Math.round(p.v * 100)}%"></i></div><small>${p.hint} · zählt ${Math.round(p.w * 100)} %</small></li>`).join('');
  const top = an.shared[0], rare = an.acc.find(x => !x.known);
  const subsTotal = an.shared.reduce((s, x) => s + x.subsShared.length, 0);
  const hl = `<ul class="hl">
    <li><small>Stärkstes Thema</small><b>${top ? esc(CAT[top.id].label) : '–'}</b></li>
    <li><small>Gemeinsame Unterthemen</small><b>${subsTotal}</b></li>
    <li><small>Seltenster gemeinsamer Account</small><b>${rare ? '@' + esc(rare.u.replace(/_cgtest$/, '')) : '–'}</b></li>
  </ul>`;
  // Profilvergleich
  const maxShare = Math.max(1, ...an.shared.map(s => Math.max(s.a.share, s.b.share)));
  const fly = an.shared.slice(0, 10).map(s => `<li><span class="fa"><i style="width:${(s.a.share / maxShare * 100).toFixed(0)}%"></i></span><span class="fl">${esc(CAT[s.id].label.split(/[ ,&]/)[0])}</span><span class="fb"><i style="width:${(s.b.share / maxShare * 100).toFixed(0)}%"></i></span></li>`).join('');
  // Themenkarten
  const card = (s, i) => {
    const c = CAT[s.id], qs = startersFor(s, tone, an);
    const subChips = [...s.subsShared.map(x => `<span class="sub on">${esc(c.subs[x]?.[0] || x)}</span>`), ...[...s.subsOnlyA, ...s.subsOnlyB].slice(0, 3).map(x => `<span class="sub">${esc(c.subs[x]?.[0] || x)}</span>`)].join('');
    return `<li class="topic${c.sensitive ? ' sens' : ''}" style="--i:${i}">${art(s.id)}<div class="rc">
      <div class="rc-head"><span class="ttitle">${esc(c.label)}</span>${s.bothTrend ? '<span class="trend">bei beiden neu dabei</span>' : ''}</div>
      <p class="tsub">${A}: ${lv(s.a)} · ${B}: ${lv(s.b)}</p>
      ${subChips ? `<div class="subs">${subChips}</div>` : ''}
      <ul class="qs">${qs.map(q => `<li>${esc(q)}</li>`).join('')}</ul>
      ${s.accs.length ? `<p class="acc-line">${s.accs.slice(0, 4).map(x => '@' + esc(x.u)).join(' · ')}${s.accs.length > 4 ? ` · +${s.accs.length - 4}` : ''}</p>` : ''}
    </div></li>`;
  };
  const main = an.shared.slice(0, 5).map(card).join('');
  const rest = an.shared.slice(5);
  // Date-Ideen
  const ideas = dateIdeas(an, d, tone).map(i => `<li class="idea"><span class="mood m-${i.mood}">${i.mood}</span><h3>${esc(i.t)}</h3><p>${esc(i.d)}</p>
    <p class="meta">${i.dur} · ${i.cost}</p>${i.why.length ? `<p class="why-line">Weil ihr beide: ${esc(i.why.join(', '))}</p>` : ''}</li>`).join('');
  // Gesprächsstoff
  const diffCard = (t, name, g) => `<li class="diff"><span class="share-thumb">${art(t.id)}</span><div><b>Nur bei ${esc(name)}: ${esc(CAT[t.id].label)}</b>
    <p>${esc(name)} folgt ${lv(t)} Accounts dazu. Frag ${esc(pron(g, name))} mal: ${esc((STARTERS[t.id]?.g || [''])[0])}</p></div></li>`;
  const diffs = [...an.onlyA.map(t => diffCard(t, d.nameA, d.genderA)), ...an.onlyB.map(t => diffCard(t, d.nameB, d.genderB))].join('');
  const bridges = an.bridges.map(b => `<li class="diff"><div><b>${esc(CAT[b.a].label)} ↔ ${esc(CAT[b.b].label)}</b><p>${A} mag ${esc(CAT[b.a].label)}, ${B} ${esc(CAT[b.b].label)}. ${esc(b.q)}</p></div></li>`).join('');
  // Accounts
  const niche = an.acc.filter(x => !x.known), known = an.acc.filter(x => x.known);
  const isB = !!d.sendBack;
  const replyMsg = `Unser Kiekr-Ergebnis 👀 ${state.replyLink || ''}`;
  const jump = [['sec-themen','Themen'],an.hasMusic && ['sec-musik','Musik'],['sec-ideen','Date-Ideen'],(diffs || bridges) && ['sec-stoff','Gesprächsstoff'],an.acc.length && ['sec-acc','Accounts']].filter(Boolean)
    .map(([id, l]) => `<button type="button" class="pill" data-jump="${id}">${l}</button>`).join('');
  return `
    <header class="res-head">
      <h1>${A} & ${B}</h1>
      <p class="chips-line">${d.rel ? `<span class="chip">${esc(d.rel)}</span>` : ''}${d.city ? `<span class="chip">${esc(d.city)}</span>` : ''}</p>
    </header>
    <section class="index-card">
      ${vennIndex(an.index, d.nameA, d.nameB)}
      <div><h2>${indexLabel(an.index)}</h2><p class="muted">Gemeinsamkeits-Index eurer Abos. Sagt nichts darüber, ob ihr zusammenpasst.</p></div>
    </section>
    <details class="why idx"><summary>So entsteht die Zahl</summary><ul class="bars">${parts}</ul></details>
    ${hl}
    <nav class="jump" aria-label="Springe zu">${jump}</nav>

    <h2 id="sec-themen">Was ihr teilt (${an.shared.length})</h2>
    ${an.shared.length ? `<div class="fly-legend"><span><i class="la"></i>${A}</span><span>Anteil an den Abos</span><span>${B}<i class="lb"></i></span></div><ul class="fly">${fly}</ul>
      <ul class="topics res">${main}</ul>
      ${rest.length ? `<details class="fold"><summary>Weitere gemeinsame Themen (${rest.length})</summary><ul class="topics res">${rest.map((s, i) => card(s, i)).join('')}</ul></details>` : ''}`
      : `<div class="note"><strong>Keine gemeinsamen Themen sichtbar.</strong><span class="muted">Vielleicht habt ihr viel verborgen, oder eure Abos sind einfach sehr verschieden. Unten findet ihr trotzdem Ideen.</span></div>`}

    ${musicSection(an, d)}
    <h2 id="sec-ideen">Date-Ideen</h2>
    <ul class="ideas">${ideas}</ul>

    ${diffs || bridges ? `<h2 id="sec-stoff">Gesprächsstoff</h2><p class="muted" style="margin:0 0 12px">Themen, die nur eine Person hat und freigegeben hat.</p>
      <ul class="diffs">${bridges}${diffs}</ul>` : ''}

    ${an.acc.length ? `<h2 id="sec-acc">Ihr folgt beide (${an.acc.length})</h2>
      ${niche.length ? `<p class="muted" style="margin:0 0 8px">Nischen-Accounts zählen mehr.</p><ul class="acc-chips">${niche.map(x => `<li>@${esc(x.u)}</li>`).join('')}</ul>` : ''}
      ${known.length ? `<details class="fold"><summary>Bekannte Accounts (${known.length})</summary><ul class="acc-chips muted-chips">${known.map(x => `<li>@${esc(x.u)}</li>`).join('')}</ul></details>` : ''}` : ''}

    ${isB ? `<section class="choice"><h2>Schick ${B} das Ergebnis</h2>
      ${state.replyLink ? `<label for="replyOut" class="sr">Ergebnis-Link</label><textarea id="replyOut" class="linkbox" readonly rows="3">${esc(state.replyLink)}</textarea>
      <div class="row"><button class="btn btn-primary" type="button" data-copy="${esc(state.replyLink)}">Link kopieren</button>
      <a class="btn" href="https://wa.me/?text=${encodeURIComponent(replyMsg)}" target="_blank" rel="noopener">Per WhatsApp</a></div>
      <p class="muted">Der Link enthält nur dieses Ergebnis, keine Listen.</p>` : '<p class="muted">Link wird erstellt …</p>'}</section>` : ''}`;
}

function renderTurn(){
  const el = document.getElementById('turn');
  const show = state.mode === 'device' && ['consent','data','share'].includes(state.screen) && (state.active === 'B' || state.persons.A.name);
  el.innerHTML = show ? `<span class="turn">Am Zug: <strong>${esc(nameOf(state.active))}</strong></span>` : '';
}

function renderDock(){
  const p = P(), dock = document.getElementById('dock');
  const bar = (left, right) => `<div class="dock"><div class="dock-inner">${left || ''}${right}</div></div>`;
  const s = state.screen;
  if (s === 'start') return dock.innerHTML = bar('', `<button class="btn btn-primary" type="button" id="begin">Los geht's</button>`);
  if (s === 'consent') return dock.innerHTML = bar('', `<button class="btn btn-primary" type="button" id="consentNext" ${p.consent.own && p.consent.compare ? '' : 'disabled'}>Weiter</button>`);
  if (s === 'share') return dock.innerHTML = bar(`<button class="btn" type="button" id="backTopics">Zurück</button>`, `<button class="btn btn-primary" type="button" id="release">Freigeben</button>`);
  if (s === 'invite' || s === 'handover' || s === 'answer') return dock.innerHTML = '';
  if (s === 'result') return dock.innerHTML = bar(`<button class="btn" type="button" id="delResult">Löschen</button>`, `<button class="btn btn-primary" type="button" id="doneResult">Fertig</button>`);
  if (!p.accounts.length) return dock.innerHTML = '';
  const n = p.accounts.filter(a => !a.removed).length;
  if (p.view === 'topics') return dock.innerHTML = bar(`<button class="btn" type="button" id="backList">Zur Liste</button>`, `<button class="btn btn-primary" type="button" id="toShare">Weiter zur Freigabe</button>`);
  dock.innerHTML = bar(`<button class="btn" type="button" id="resetOne">Andere Liste</button>`, `<button class="btn btn-primary" type="button" id="next" ${n ? '' : 'disabled'}>Weiter zu Themen</button>`);
}

function render(){
  const p = P(), s = state.screen;
  const html = s === 'start' ? renderStart() : s === 'consent' ? renderConsent() : s === 'share' ? renderShare()
    : s === 'invite' ? renderInvite() : s === 'answer' ? renderAnswer() : s === 'handover' ? renderHandover() : s === 'result' ? renderResult()
    : !p.accounts.length ? renderInput() : p.view === 'topics' ? renderTopics() : renderPreview();
  document.getElementById('main').innerHTML = html;
  renderTurn(); renderDock();
}
function go(screen){ state.screen = screen; if (screen === 'result') rememberResult(); render(); window.scrollTo(0, 0); document.querySelector('main h1')?.focus?.({ preventScroll:true }); }

/* ---------- Dialoge, Hinweise ---------- */
let toastTimer;
function toast(msg){
  const o = document.getElementById('overlay');
  o.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; o.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
  announce(msg);
}
function announce(msg){ const l = document.getElementById('live'); l.textContent = ''; setTimeout(() => l.textContent = msg, 30); }
function openDeleteSheet(){
  const o = document.getElementById('overlay');
  o.insertAdjacentHTML('beforeend', `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="delTitle">
    <h3 id="delTitle">Alles löschen?</h3>
    <p>Listen, Themen und alle gespeicherten Vergleiche auf diesem Gerät werden entfernt.</p>
    <div class="row" style="margin-top:8px"><button class="btn" type="button" id="delCancel" style="flex:1">Abbrechen</button><button class="btn btn-danger" type="button" id="delConfirm" style="flex:1">Alles löschen</button></div>
  </div></div>`);
  document.getElementById('delConfirm').focus();
}
function closeSheet(){ document.getElementById('scrim')?.remove(); document.getElementById('delAll').focus(); }
function clearHash(){ try { history.replaceState(null, '', location.pathname + location.search); } catch { try { location.hash = ''; } catch {} } }
async function copy(text, box){
  try { await navigator.clipboard.writeText(text); toast('Link kopiert'); }
  catch { const el = document.getElementById(box); el?.focus(); el?.select(); toast('Link markiert – jetzt kopieren'); }
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', async e => {
  if (e.target.closest('a[data-export]')){ rememberWaiting(); return; }
  const t = e.target.closest('button');
  if (!t) { if (e.target.id === 'scrim') closeSheet(); return; }
  const p = P();
  if (t.dataset.topic){ p.openTopic = p.openTopic === t.dataset.topic ? null : t.dataset.topic; render(); document.querySelector(`[data-topic="${t.dataset.topic}"]`)?.focus({preventScroll:true}); return; }
  if (t.dataset.tab){ p.tab = t.dataset.tab; p.error = null; render(); document.getElementById('tab-' + p.tab)?.focus(); return; }
  if (t.dataset.gender){ p.gender = p.gender === t.dataset.gender ? null : t.dataset.gender; render(); document.querySelector(`[data-gender="${t.dataset.gender}"]`)?.focus(); return; }
  if (t.dataset.rel){ state.rel = state.rel === t.dataset.rel ? null : t.dataset.rel; render(); document.querySelector(`[data-rel="${t.dataset.rel}"]`)?.focus(); return; }
  if (t.dataset.mode){ const [id, v] = t.dataset.mode.split(':'); p.modes[id] = v; render(); document.querySelector(`[data-mode="${id}:${v}"]`)?.focus({preventScroll:true}); return; }
  if (t.dataset.jump){ document.getElementById(t.dataset.jump)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start' }); return; }
  if (t.dataset.hist){ const h = history().find(x => x.id === t.dataset.hist); if (h){ state = fresh(); state.result = { ...h.data, savedId:h.id, sendBack:false }; go('result'); } return; }
  if (t.dataset.histdel){ forgetResult(t.dataset.histdel); render(); return toast('Vergleich gelöscht'); }
  if (t.dataset.copy) return copy(t.dataset.copy, t.dataset.box || (t.id === 'copyLink' ? 'linkOut' : 'replyOut'));
  if (t.dataset.remove){ const a = p.accounts.find(x => x.u === t.dataset.remove); a.removed = true; render(); document.getElementById('search')?.focus({preventScroll:true}); return toast(`@${a.u} entfernt`); }
  if (t.dataset.restore){ const a = p.accounts.find(x => x.u === t.dataset.restore); a.removed = false; render(); return toast(`@${a.u} zurückgeholt`); }
  switch (t.id){
    case 'resumeWait': {
      const w = readWaiting(); if (!w) return render();
      if (w.invite){ try { await openCode(w.invite); } catch (err){ state.codeErr = codeError(err); return render(); } }
      else { state.mode = 'device'; state.active = 'A'; state.rel = w.rel || null; state.city = w.city || ''; }
      Object.assign(P(), { name: w.name || '', gender: w.gender || null, tab:'file' });
      return go('consent');
    }
    case 'doneResult': { const keep = state.result?.savedId; state = fresh(); clearHash(); go('start'); return toast(keep ? 'Unter „Deine Vergleiche“ gespeichert' : 'Fertig'); }
    case 'delResult': { if (state.result?.savedId) forgetResult(state.result.savedId); state = fresh(); clearHash(); go('start'); return toast('Vergleich gelöscht'); }
    case 'dropWait': { forgetWaiting(); return render(); }
    case 'begin': { state.mode = 'device'; state.active = 'A'; return go('consent'); }
    case 'openCode': {
      const v = document.getElementById('codeIn').value; state.codeIn = v;
      try { await openCode(v); return go(state.screen); }
      catch (e) { state.codeErr = codeError(e); return render(); }
    }
    case 'consentNext': { p.view = 'preview'; return go('data'); }
    case 'usePaste': { const v = document.getElementById('paste').value; p.pasteText = v; return accept(parseText(v), 'Eingefügte Liste'); }
    case 'fillMessy': { p.pasteText = SAMPLE_TXT; render(); return document.getElementById('paste').focus(); }
    case 'useDemo': return accept(parseJSON(SAMPLE[state.active]), 'Beispieldaten');
    case 'useDemoC': return accept(parseJSON(SAMPLE.C), 'Beispiel Outdoor & Südtirol');
    case 'pendingYes': { commit(p, p.pending.parsed, p.pending.source); return render(); }
    case 'pendingNo': { p.pending = null; return render(); }
    case 'toggleRej': { p.showRejected = !p.showRejected; return render(); }
    case 'resetOne': { const keep = { name:p.name, consent:p.consent }; state.persons[state.active] = Object.assign(newPerson(), keep); render(); return toast('Liste entfernt'); }
    case 'next': { p.view = 'topics'; render(); window.scrollTo(0, 0); return; }
    case 'backList': { p.view = 'preview'; render(); window.scrollTo(0, 0); return; }
    case 'toShare': return go('share');
    case 'backTopics': { p.view = 'topics'; return go('data'); }
    case 'release': {
      p.summary = buildSummary(p); wipeRaw(p);
      if (state.active === 'A'){ state.link = null; go('invite'); state.link = await makeInvite(); if (state.screen === 'invite') render(); return; }
      return finishB();
    }
    case 'claudeRun': return runClaude();
    case 'toHandover': return go('handover');
    case 'takeOver': { state.active = 'B'; return go('consent'); }
    case 'delAll': case 'delAll2': return openDeleteSheet();
    case 'delCancel': return closeSheet();
    case 'delConfirm': { state = fresh(); dropAllSessions(); forgetWaiting(); try { localStorage.removeItem(HKEY); } catch {} for (const k in ENRICH) delete ENRICH[k]; clearHash(); document.getElementById('scrim')?.remove(); go('start'); return toast('Alles gelöscht'); }
  }
});
document.addEventListener('toggle', e => { const k = e.target.dataset?.fold; if (k){ P().folds[k] = e.target.open; const sm = e.target.querySelector('summary small'); if (sm) sm.textContent = e.target.open ? '' : 'antippen zum Ansehen'; } }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('scrim')) closeSheet(); });
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'search'){ P().query = e.target.value; document.getElementById('list').innerHTML = listItems(); }
  if (id === 'paste') P().pasteText = e.target.value;
  if (id === 'myName') P().name = e.target.value;
  if (id === 'city') state.city = e.target.value;
  if (id === 'codeIn') state.codeIn = e.target.value;
});
document.addEventListener('change', e => {
  if (e.target.id === 'file'){ handleFile(e.target.files[0]); e.target.value = ''; }
  if (e.target.id === 'showAcc'){ P().showAccounts = e.target.checked; render(); }
  if (e.target.dataset.consent){ P().consent[e.target.dataset.consent] = e.target.checked; renderDock(); }
  if (e.target.dataset.move){
    const p = P(), u = e.target.dataset.move, v = e.target.value;
    if (v === 'remove'){ p.accounts.find(a => a.u === u).removed = true; render(); return toast(`@${u} entfernt`); }
    p.overrides[u] = v; render();
    toast(v === 'unclear' ? `@${u} → Unklar` : `@${u} → ${CAT[v].label}`);
  }
});
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest?.('#drop'); if (d){ e.preventDefault(); d.classList.add('over'); } }));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest?.('#drop'); if (d){ e.preventDefault(); d.classList.remove('over'); if (ev === 'drop') handleFile(e.dataTransfer.files[0]); } }));
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());

function codeError(e){
  return e?.message === 'keine Sitzung' ? 'Diese Antwort gehört zu einer Einladung aus einem anderen Browser. Öffne sie dort, wo du die Einladung erstellt hast.'
    : 'Das ist kein gültiger Kiekr-Link. Kopier den ganzen Link noch einmal.';
}
async function fromHash(){
  const h = location.hash.slice(1);
  if (!/^(einladung|antwort|ergebnis)-/.test(h)) return;
  try { await openCode(h); if (h.startsWith('antwort-')) clearHash(); }
  catch (e) { state = fresh(); state.codeIn = h; state.codeErr = codeError(e); clearHash(); }
  go(state.screen);
}
window.addEventListener('hashchange', fromHash);
render(); fromHash();
</script>
</body>
</html>
