<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiekr</title>
<style>
/* Layout: eine schmale, linksbündige Spalte (max. 480px), Aktionen unten in der Daumenzone.
   Leitmotiv: jede Liste ist ein Kreis aus Punkten. A = gefüllte Punkte, B = Ringe. */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --ink:#1D1D1F; --ink-2:#6E6E73; --line:#E5E5EA;
  --a:#5E5CE6; --b:#3CCFB4; --b-ink:#14967F; --blend:multiply; --aura-o:.35; --vnum:#FFFFFF;
  --accent:#5E5CE6; --accent-ink:#FFFFFF; --accent-soft:rgba(94,92,230,.10); --accent-glow:rgba(94,92,230,.55);
  --danger:#FF3B30; --danger-soft:rgba(255,59,48,.08);
  --fill:rgba(118,118,128,.12); --fill-strong:rgba(120,120,128,.20); --hair:rgba(60,60,67,.18); --hair-strong:rgba(60,60,67,.29);
  --glass:rgba(245,245,247,.72); --glass-dark:rgba(30,30,32,.82);
  --card-shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.12);
  --shadow:0 20px 40px -12px rgba(0,0,0,.25);
  --f-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
  --f-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --f-round:ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  --s1:13px; --s2:16px; --s3:20px; --s4:32px;
  --as:42%; --abl:90%; --a1l:32%; --a2l:72%;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --ink:#F5F5F7; --ink-2:#98989D; --line:#38383A;
    --a:#7D7AFF; --b:#5FE0C8; --b-ink:#5FE0C8; --blend:screen; --aura-o:.45; --vnum:#0A0A1F;
    --accent:#7D7AFF; --accent-ink:#FFFFFF; --accent-soft:rgba(125,122,255,.16); --accent-glow:rgba(125,122,255,.5);
    --danger:#FF453A; --danger-soft:rgba(255,69,58,.12);
    --fill:rgba(118,118,128,.24); --fill-strong:rgba(120,120,128,.36); --hair:rgba(84,84,88,.6); --hair-strong:rgba(84,84,88,.8);
    --glass:rgba(0,0,0,.66); --glass-dark:rgba(58,58,60,.85);
    --card-shadow:none;
    --shadow:0 20px 40px -12px rgba(0,0,0,.6);
    --as:28%; --abl:21%; --a1l:74%; --a2l:38%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --ink:#F5F5F7; --ink-2:#98989D; --line:#38383A;
  --a:#7D7AFF; --b:#5FE0C8; --b-ink:#5FE0C8; --blend:screen; --aura-o:.45; --vnum:#0A0A1F;
  --accent:#7D7AFF; --accent-ink:#FFFFFF; --accent-soft:rgba(125,122,255,.16); --accent-glow:rgba(125,122,255,.5);
  --danger:#FF453A; --danger-soft:rgba(255,69,58,.12);
  --fill:rgba(118,118,128,.24); --fill-strong:rgba(120,120,128,.36); --hair:rgba(84,84,88,.6); --hair-strong:rgba(84,84,88,.8);
  --glass:rgba(0,0,0,.66); --glass-dark:rgba(58,58,60,.85);
  --card-shadow:none;
  --shadow:0 20px 40px -12px rgba(0,0,0,.6);
  --as:28%; --abl:21%; --a1l:74%; --a2l:38%;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--s2);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 120px}

/* Kopfzeile */
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:var(--s2);letter-spacing:-.01em}
.btn-del{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:var(--s1);font-weight:600;color:var(--danger);cursor:pointer}
.btn-del:hover{background:var(--danger-soft)}

/* Personen-Umschalter */
.who{display:flex;flex-direction:column;gap:8px;margin:8px 0 24px}
.who-label{font-size:var(--s1);color:var(--ink-2)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.seg button{min-height:44px;border:0;background:transparent;border-radius:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.seg .done{font-size:var(--s1);font-weight:400;color:var(--accent)}

h1{font-family:var(--f-display);font-weight:700;font-size:var(--s4);line-height:1.1;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
.lead{color:var(--ink-2);margin:0 0 24px}

/* Eingabe-Tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tab{min-height:44px;padding:0 8px;white-space:nowrap;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:600;font-size:var(--s1);color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px}
.drop{border:1.5px dashed var(--line);border-radius:16px;padding:32px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;cursor:pointer;transition:background .2s,border-color .2s}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:0}
.muted{color:var(--ink-2);font-size:var(--s1)}
textarea{width:100%;min-height:180px;resize:vertical;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:48px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:var(--s1)}

details{border-top:1px solid var(--line);padding-top:16px}
summary{cursor:pointer;font-weight:600;min-height:32px}
details ol{margin:8px 0 0;padding-left:20px;color:var(--ink-2)}
details li{margin-bottom:6px}

.alert{border-radius:16px;padding:16px;background:var(--danger-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--danger) 30%,transparent)}
.alert strong{color:var(--danger)}
.note{border-radius:16px;padding:16px;background:var(--accent-soft);display:flex;flex-direction:column;gap:12px}
.privacy{display:flex;gap:8px;align-items:flex-start;color:var(--ink-2);font-size:var(--s1);margin-top:24px}
.privacy svg{flex:0 0 auto;margin-top:2px}

/* Vorschau */
.hero{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center;margin-bottom:24px}
.dots{width:132px;height:132px}
.dots circle.d{transform-box:fill-box;transform-origin:center}
.dots.anim circle.d{animation:pop .5s cubic-bezier(.2,.8,.3,1.4) both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.num{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.num-label{color:var(--ink-2);margin-top:4px}
.stats{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:var(--s1);color:var(--ink-2)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent)}
.rejected{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;font-size:var(--s1)}
.rejected ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2);word-break:break-all}
.search{width:100%;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin:8px 0 12px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.list li{display:flex;align-items:center;gap:12px;padding:4px 4px 4px 16px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .u{flex:1;min-width:0;overflow-wrap:anywhere;padding:10px 0}
.list .u span{color:var(--ink-2)}
.icon-btn{flex:0 0 auto;width:44px;height:44px;border:0;background:transparent;border-radius:12px;cursor:pointer;color:var(--ink-2);display:grid;place-items:center}
.icon-btn:hover{background:var(--danger-soft);color:var(--danger)}
.icon-btn.restore:hover{background:var(--accent-soft);color:var(--accent)}
.empty-search{padding:24px 16px;color:var(--ink-2);text-align:center}
h2{font-family:var(--f-display);font-weight:700;font-size:var(--s3);margin:32px 0 8px;letter-spacing:-.01em}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:24px 16px calc(16px + env(safe-area-inset-bottom))}
.dock-inner{max-width:480px;margin:0 auto;display:flex;gap:8px}
.dock .btn{flex:0 0 auto;padding:0 16px;white-space:nowrap}
.dock .btn-primary,.dock .btn.wide{flex:1 1 auto}
.hint{max-width:480px;margin:0 auto 8px;font-size:var(--s1);color:var(--ink-2);text-align:center}

/* Themen */
.split{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line);gap:2px;margin-bottom:8px}
.split span{display:block;height:100%}
.s-a{background:var(--accent)} .s-u{background:color-mix(in srgb,var(--ink-2) 45%,transparent)} .s-x{background:color-mix(in srgb,var(--ink-2) 18%,transparent)}
.legend{list-style:none;margin:0 0 24px;padding:0;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:var(--s1);color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.topics{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;animation:slide .45s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i) * 45ms)}
@keyframes slide{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.topic-head{width:100%;display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px;padding:16px;border:0;background:transparent;text-align:left;cursor:pointer}
.ticon{flex:0 0 auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tmain{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.ttitle{font-family:var(--f-display);font-weight:700;font-size:var(--s3);letter-spacing:-.01em;line-height:1.2}
.tsub{color:var(--ink-2);font-size:var(--s1)}
.strength{display:flex;align-items:center;gap:4px;margin-top:8px}
.seg-bar{width:28px;height:6px;border-radius:999px;background:var(--line)}
.seg-bar.on{background:var(--accent)}
.strength em{font-style:normal;font-size:var(--s1);color:var(--ink-2);margin-left:6px}
.subs{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.sub{font-size:var(--s1);padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2)}
.sub b{color:var(--ink);font-weight:600}
.topic.sens .ticon{background:color-mix(in srgb,var(--ink-2) 12%,transparent);color:var(--ink-2)}
.topic.sens .seg-bar.on{background:var(--ink-2)}
.chev{flex:0 0 auto;margin-top:12px;color:var(--ink-2);transition:transform .2s}
.topic-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.acc{list-style:none;margin:0;padding:0 16px 8px}
.acc li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.acc.boxed{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:0 16px}
.acc.boxed li:first-child{border-top:0}
.acc.quiet .acc-u span{color:var(--ink-2)}
.acc-u{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.acc-u small{color:var(--ink-2);font-size:var(--s1)}
.mv{flex:0 0 auto;max-width:44%;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 8px;font-size:16px}
.why{margin-top:12px}
.why p{margin:8px 0 0}

/* Illustrationen und Fotos */
.pic{position:relative;display:block;width:100%;height:96px;overflow:hidden;background:var(--line)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.topic .pic{border-bottom:1px solid var(--line)}
.topic .pic,.music .pic{height:120px}
.topic .pic .art,.music .pic .art{height:120px}
.share-thumb .pic{height:40px}
.guide-title{font-weight:700;font-family:var(--f-display);font-size:var(--s3);margin:0 0 12px}
.export-btn{display:flex;width:100%;margin-bottom:12px}
.pick{margin:8px 0 12px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.note-line{margin:0 0 12px;padding:12px;border-radius:14px;background:var(--accent-soft);font-size:var(--s1);line-height:1.5}
.guide details{border-top:1px solid var(--line);padding-top:12px}
.waiting{background:var(--accent-soft);border:1px solid var(--accent);border-radius:20px;padding:16px;margin:0 0 20px;display:flex;flex-direction:column;gap:8px}
.waiting p{margin:0;font-size:var(--s1);line-height:1.5}
.guide{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 16px}
.guide summary{font-weight:600}
.guide .steps{margin:12px 0;padding-left:22px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.guide .steps li{line-height:1.45}
.guide p{margin:8px 0 0}
.art{display:block;width:100%;height:96px}
.art *{stroke-linecap:round;stroke-linejoin:round}
.ab{fill:hsl(var(--h) var(--as) var(--abl))} .a1{fill:hsl(var(--h) var(--as) var(--a1l))} .a2{fill:hsl(var(--h) var(--as) var(--a2l))}
.ac{fill:var(--accent)} .aw{fill:var(--surface)}
.s1{fill:none;stroke:hsl(var(--h) var(--as) var(--a1l))} .s2{fill:none;stroke:hsl(var(--h) var(--as) var(--a2l))}
.sc{fill:none;stroke:var(--accent)} .sw{fill:none;stroke:var(--surface)}
.atx{font-family:var(--f-display);font-weight:700;font-size:22px;fill:hsl(var(--h) var(--as) var(--a1l))}
.topic .art{border-bottom:1px solid var(--line)}
.share-thumb{flex:0 0 auto;width:56px;height:40px;border-radius:10px;overflow:hidden}
.share-thumb .art{height:40px}
details.fold{margin-top:24px;border:0;padding:0}
details.fold>summary{font-family:var(--f-display);font-weight:700;font-size:var(--s3);list-style:none;display:flex;align-items:center;gap:8px;min-height:44px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);margin-left:4px;transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(-135deg)}
details.fold>summary small{font-family:var(--f-body);font-weight:400;font-size:var(--s1);color:var(--ink-2)}

/* Ablauf */
#turn{min-height:8px}
.turn{display:inline-flex;gap:6px;align-items:center;margin:0 0 16px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);font-size:var(--s1);color:var(--ink-2)}
.turn strong{color:var(--ink)}
.eyes{width:120px;height:72px;display:block;margin:8px 0 24px}
.eyes .pupil{animation:glance 3.2s ease-in-out 600ms 1 both}
@keyframes glance{0%,100%{transform:translateX(0)}30%,55%{transform:translateX(8px)}70%,85%{transform:translateX(-4px)}}
.eyes .pupil:last-child{animation-name:glance2}
@keyframes glance2{0%,100%{transform:translateX(0)}30%,55%{transform:translateX(-8px)}70%,85%{transform:translateX(4px)}}
.start{padding-top:8px}
.start h1{font-size:40px}
.facts{list-style:none;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:8px;color:var(--ink-2)}
.facts li{display:flex;gap:8px;align-items:center}
.codebox{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.codebox[open]{display:flex}
.codebox .search{margin:4px 0}
.codebox .alert{margin:4px 0 8px}
.field{display:flex;flex-direction:column;gap:8px;margin:0 0 20px;border:0;padding:0}
.field legend,.field label{font-weight:600;margin-bottom:8px}
.field .search{margin:0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:var(--s1);color:var(--ink-2)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:0 0 auto}
.check:has(input:checked){border-color:var(--accent)}
.why ul{margin:8px 0 0;padding-left:20px}
.invite-banner{display:flex;gap:16px;align-items:center;padding:16px;border-radius:20px;background:var(--accent-soft);margin-bottom:24px}
.invite-banner .eyes{width:64px;height:40px;margin:0;flex:0 0 auto}
.invite-banner p{margin:0}
.modes-help{display:grid;gap:4px;margin:0 0 20px;font-size:var(--s1)}
.modes-help div{display:flex;gap:8px}
.modes-help dt{font-weight:600;min-width:88px}
.modes-help dd{margin:0;color:var(--ink-2)}
.share-list{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:8px}
.share-row{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.share-top{display:flex;gap:12px;align-items:center}
.ticon.sm{width:36px;height:36px;border-radius:12px}
.share-name{display:flex;flex-direction:column;line-height:1.3}
.share-name small{color:var(--ink-2);font-size:var(--s1)}
.share-row.sens .ticon{background:color-mix(in srgb,var(--ink-2) 12%,transparent);color:var(--ink-2)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--bg)}
.tri button{min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:var(--s1);color:var(--ink-2);cursor:pointer}
.tri button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(14,60,56,.12)}
.tri button[aria-checked="true"][data-mode$=":immer"]{background:var(--accent);color:var(--accent-ink)}
.switch-row{margin-top:16px}
.seen{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:16px}
.seen h2{margin:0 0 12px}
.seen p{margin:0 0 10px}
.seen p:last-child{margin:0}
.tag{display:block;font-size:var(--s1);font-weight:600;color:var(--accent);margin-bottom:2px}
.tag.off{color:var(--ink-2)}
.choice{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;margin-top:16px;display:flex;flex-direction:column;gap:12px}
.choice h2{margin:0}
.choice p{margin:0}
.linkbox{min-height:0;font-size:var(--s1);color:var(--ink-2);word-break:break-all}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
a.btn.btn-primary{color:var(--accent-ink)}
.handover{display:flex;flex-direction:column;align-items:flex-start;padding-top:32px}
.pair .eyes{margin:0 0 16px;width:88px;height:53px}
.topic-head.static{cursor:default}
.acc-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.acc-chips li{padding:8px 12px;border-radius:999px;background:var(--accent-soft);font-size:var(--s1);font-weight:600}

/* Claude */
.claude-card{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--accent);border-radius:20px;padding:16px;margin:0 0 16px}
.claude-card.done{border-color:var(--line);background:var(--accent-soft)}
.claude-card .btn{align-self:flex-start}
.music{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.music .rc{gap:14px}
.music h3{margin:0;font-family:var(--f-display);font-size:var(--s2)}
.mrow{display:flex;flex-direction:column;gap:6px}
.artists{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.artists li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:14px;background:var(--bg)}
.artists .links{display:flex;gap:6px;flex:0 0 auto}
.artists a{font-size:var(--s1);font-weight:600;color:var(--accent);text-decoration:none;padding:6px 10px;border-radius:999px;border:1px solid var(--line);min-height:32px;display:inline-flex;align-items:center}
.seed-links{display:flex;flex-wrap:wrap;gap:8px}
.seed-links a{font-size:var(--s1);font-weight:600;color:var(--ink);text-decoration:none;padding:6px 12px;border-radius:999px;background:var(--accent-soft)}

/* Ergebnis */
.trend{display:inline-block;font-size:var(--s1);font-weight:600;color:var(--accent)}
.res-head h1{margin-bottom:8px}
.chips-line{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}
.index-card{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px}
.index-card h2{margin:0 0 4px}
.index-card p{margin:0;font-size:var(--s1)}
.ring-wrap{position:relative;width:112px;height:112px}
.ring{width:112px;height:112px}
.ring-bg{fill:none;stroke:var(--line);stroke-width:10}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;animation:ringin 1.1s cubic-bezier(.2,.8,.3,1) both}
@keyframes ringin{from{stroke-dashoffset:330}}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num b{font-family:var(--f-display);font-size:var(--s4);line-height:1;font-variant-numeric:tabular-nums}
.ring-num small{font-size:var(--s1);color:var(--ink-2)}
.idx{margin:8px 0 16px}
.bars{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.bar-top{display:flex;justify-content:space-between;font-size:var(--s1)}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bars small{color:var(--ink-2);font-size:var(--s1)}
.hl{list-style:none;margin:0 0 16px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hl li{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.hl li:last-child{grid-column:1/-1}
.hl small{font-size:var(--s1);color:var(--ink-2)}
.hl b{font-family:var(--f-display);font-size:var(--s3);overflow-wrap:anywhere}
.jump{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;position:sticky;top:68px;z-index:4;background:var(--bg)}
.jump .pill{flex:0 0 auto}
h2[id]{scroll-margin-top:124px}
.fly-legend{display:flex;justify-content:space-between;font-size:var(--s1);color:var(--ink-2);margin:4px 0 8px}
.fly-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 6px;vertical-align:-1px}
.la{background:var(--accent)} .lb{border:2px solid var(--accent)}
.fly{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:6px}
.fly li{display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;gap:8px}
.fa,.fb{height:12px;display:flex}
.fa{justify-content:flex-end}
.fa i{display:block;height:100%;background:var(--accent);border-radius:6px 2px 2px 6px}
.fb i{display:block;height:100%;border:2px solid var(--accent);border-radius:2px 6px 6px 2px;box-sizing:border-box}
.fl{text-align:center;font-size:var(--s1);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc{padding:16px;display:flex;flex-direction:column;gap:10px}
.rc-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.rc .tsub{margin:0}
.rc .subs{margin:0}
.sub.on{background:var(--accent-soft);border-color:transparent;color:var(--ink);font-weight:600}
.qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.qs li{position:relative;padding:10px 12px 10px 36px;border-radius:14px;background:var(--bg);line-height:1.4}
.qs li::before{content:"„";position:absolute;left:12px;top:2px;font-family:var(--f-display);font-size:28px;color:var(--accent)}
.acc-line{margin:0;font-size:var(--s1);color:var(--ink-2);overflow-wrap:anywhere}
.ideas{list-style:none;margin:0 -16px;padding:4px 16px 12px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:16px}
.idea{flex:0 0 78%;max-width:320px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px}
.idea h3{margin:4px 0 0;font-family:var(--f-display);font-size:var(--s3);line-height:1.2}
.idea p{margin:0;font-size:var(--s1);color:var(--ink-2);line-height:1.45}
.idea .meta{color:var(--ink);font-weight:600}
.idea .why-line{margin-top:auto;padding-top:6px;color:var(--accent);font-weight:600}
.mood{align-self:flex-start;font-size:var(--s1);font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);text-transform:capitalize}
.diffs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.diff{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.diff p{margin:4px 0 0;font-size:var(--s1);color:var(--ink-2);line-height:1.45}
.muted-chips li{background:var(--surface);border:1px solid var(--line);font-weight:400;color:var(--ink-2)}
.topics.res .topic{animation-delay:calc(var(--i) * 60ms)}

/* Dialog und Hinweis */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,20,18,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:24px;padding:24px;max-width:448px;width:100%;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out}
.sheet h3{font-family:var(--f-display);font-size:var(--s3);margin:0}
.sheet p{margin:0;color:var(--ink-2)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:var(--s1);font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow);animation:up .25s ease-out}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Verlauf */
.hist{margin:0 0 20px}
.hist h2{margin:0 0 10px}
.hist-list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:18px;box-shadow:var(--card-shadow);overflow:hidden}
.hist-list li{display:flex;align-items:center;gap:4px;padding-right:4px}
.hist-list li + li{border-top:.5px solid var(--hair)}
.hist-open{flex:1;display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:12px 8px 12px 16px;text-align:left;cursor:pointer;min-width:0}
.venn.mini{width:44px;height:28px;flex:0 0 auto;overflow:visible}
.hist-txt{flex:1;display:flex;flex-direction:column;min-width:0}
.hist-txt b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-txt small{color:var(--ink-2);font-size:13px}
.hist-idx{font-family:var(--f-round);font-weight:700;font-size:20px;color:var(--ink-2)}
.small{font-size:13px;margin:8px 0 0}
.version{margin:24px 0 0;font-size:12px;color:var(--ink-2);text-align:center}

/* ===== Apple-Look v2 =====
   Grund: Apple-Grau / echtes Schwarz. Personen: A = Indigo, B = Mint. Die Mischfarbe entsteht nur dort, wo sich beide überlagern.
   Systemschrift (SF Pro / Roboto), große linksbündige Titel, Glas-Leisten, gruppierte Listen, Pillen-Knöpfe. */
body{font-size:17px;letter-spacing:-.01em;line-height:1.47}
h1{font-size:34px;line-height:1.12;letter-spacing:-.025em;font-weight:700}
h2{font-size:22px;letter-spacing:-.02em;font-weight:700}
.lead{font-size:17px;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.wrap{padding:0 20px 132px}

/* Glas-Kopfzeile */
.top{margin:0 -20px;padding:10px 20px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--hair)}
.brand{font-family:var(--f-round);font-size:19px;font-weight:700;letter-spacing:-.02em}
.btn-del{border:0;background:var(--fill);min-height:36px;padding:0 14px;font-size:15px;font-weight:500}
.btn-del svg{width:15px;height:15px}

/* Knöpfe */
.btn{border:0;background:var(--fill);border-radius:999px;min-height:50px;padding:0 22px;font-size:17px;font-weight:600;letter-spacing:-.01em;transition:transform .15s ease, filter .15s ease}
.btn:hover{border:0;filter:brightness(.97)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 20px -6px var(--accent-glow)}
.btn-primary:hover{filter:brightness(1.06)}
a.btn.btn-primary{color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.link{color:var(--accent);text-decoration:none;font-size:15px}
.pill{border:0;background:var(--fill);min-height:36px;font-size:15px;font-weight:500;color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{border:0;background:var(--fill);font-size:13px}

/* Glas-Leiste unten */
.dock{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--hair);padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.dock .btn{min-height:50px}

/* Karten und gruppierte Listen (wie iOS-Einstellungen) */
.panel,.guide,.codebox,.choice,.seen,.claude-card,.rejected,.index-card,.hl li,.share-row,.diff,.idea,.music,.topic,.list,.acc.boxed{border:0;box-shadow:var(--card-shadow)}
.panel,.choice,.music,.topic,.index-card{border-radius:22px}
.guide,.codebox,.seen,.claude-card,.list,.acc.boxed{border-radius:18px}
.list li,.acc li{border-top:.5px solid var(--hair)}
.search,textarea{border:0;background:var(--fill);border-radius:12px;font-size:17px}
.search{min-height:44px}
.tabs{background:var(--fill);padding:3px;border-radius:12px;gap:2px}
.tab{border:0;min-height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.drop{border:1.5px dashed var(--hair-strong);border-radius:16px}

/* Zustimmung als Schalter */
.checks{background:var(--surface);border-radius:18px;box-shadow:var(--card-shadow);overflow:hidden;gap:0}
.check{border:0;border-radius:0;background:transparent;padding:14px 16px;align-items:center;justify-content:space-between;flex-direction:row-reverse;gap:16px}
.check + .check{border-top:.5px solid var(--hair)}
.check:has(input:checked){border-color:transparent}
.check input{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--fill-strong);position:relative;cursor:pointer;transition:background .2s;margin:0}
.check input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s cubic-bezier(.3,.7,.4,1)}
.check input:checked{background:var(--b)}
.check input:checked::after{transform:translateX(20px)}
.switch-row{background:var(--surface);border-radius:18px;box-shadow:var(--card-shadow)}

/* Freigabe: Segmente wie iOS */
.share-list{gap:10px}
.share-row{border-radius:18px;background:var(--surface)}
.tri{background:var(--fill);border-radius:10px;padding:2px}
.tri button{border-radius:8px;min-height:34px;color:var(--ink);font-weight:500}
.tri button[aria-checked="true"]{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.14);font-weight:600}
.tri button[aria-checked="true"][data-mode$=":immer"]{background:var(--accent);color:#fff}
.tri button[aria-checked="true"][data-mode$=":aus"]{color:var(--ink-2)}

/* Themenkarten */
.topic{background:var(--surface);overflow:hidden}
.ticon{background:var(--accent-soft);color:var(--accent);border-radius:12px}
.seg-bar{background:var(--fill-strong)}
.seg-bar.on{background:var(--accent)}
.sub{border:0;background:var(--fill);color:var(--ink-2)}
.sub.on{background:var(--accent-soft);color:var(--accent)}
.qs li{background:var(--fill)}
.qs li::before{color:var(--b)}
.trend{color:var(--b-ink)}
.acc-chips li{background:var(--fill);font-weight:500}
.mood{background:var(--accent-soft);color:var(--accent)}
.idea .why-line{color:var(--accent)}

/* Personen-Kreise: das Markenzeichen */
.venn .ca{fill:var(--a)} .venn .cb{fill:var(--b)}
.venn .ca,.venn .cb{mix-blend-mode:var(--blend)}
.eyes{width:132px;height:80px;margin:4px 0 20px;overflow:visible}
.eyes .pupil{fill:#fff}
.brand svg{overflow:visible}

/* Start */
.start{position:relative}
.start h1{font-size:44px;line-height:1.04;letter-spacing:-.035em}
.aura{position:absolute;inset:-40px -60px auto -60px;height:340px;z-index:-1;pointer-events:none;filter:blur(60px);opacity:var(--aura-o)}
.aura i{position:absolute;width:220px;height:220px;border-radius:50%}
.aura i:first-child{left:10%;top:20px;background:var(--a)}
.aura i:last-child{left:42%;top:60px;background:var(--b)}
.facts li svg{color:var(--b-ink)}
.export-btn{min-height:50px}
.note-line{background:var(--fill)}
.waiting{border:0;background:var(--surface);box-shadow:var(--card-shadow)}
.invite-banner{background:var(--surface);box-shadow:var(--card-shadow);border-radius:18px}
.turn{background:var(--fill)}

/* Ergebnis: Überlappung = Index */
.index-card{grid-template-columns:1fr;justify-items:start;padding:20px}
.vres{width:100%;max-width:320px;height:auto;display:block;margin:0 auto 4px;overflow:visible}
.vres .ca{animation:inA 1.2s cubic-bezier(.2,.8,.2,1) both}
.vres .cb{animation:inB 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes inA{from{transform:translateX(calc(var(--dx) * -1px))}}
@keyframes inB{from{transform:translateX(calc(var(--dx) * 1px))}}
.vres .num{font-family:var(--f-round);font-weight:800;font-size:46px;fill:var(--vnum);letter-spacing:-.02em}
.vres .lbl{font-family:var(--f-round);font-size:15px;font-weight:600;fill:var(--ink-2)}
.vres .nm{font-size:13px;font-weight:600;fill:var(--ink-2)}
.ring-wrap{display:none}
.hl b{font-family:var(--f-round)}
.fa i{background:var(--a)} .fb i{border-color:var(--b);background:color-mix(in srgb,var(--b) 25%,transparent)}
.la{background:var(--a)} .lb{border-color:var(--b);background:color-mix(in srgb,var(--b) 25%,transparent)}
.bar i{background:linear-gradient(90deg,var(--a),var(--b))}
.jump{margin:0 -20px;padding:8px 20px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);top:57px}

/* Bottom Sheet und Toast */
.sheet{border-radius:22px 22px 18px 18px;padding:12px 20px 20px}
.sheet::before{content:"";align-self:center;width:36px;height:5px;border-radius:3px;background:var(--fill-strong);margin-bottom:6px}
.toast{background:var(--glass-dark);color:#fff;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:999px;padding:12px 20px}
@media (prefers-reduced-motion: reduce){.vres .ca,.vres .cb{animation:none}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="venn" width="30" height="20" viewBox="0 0 30 20" aria-hidden="true"><circle class="ca" cx="10" cy="10" r="9"/><circle class="cb" cx="20" cy="10" r="9"/></svg>
      Kiekr
    </div>
    <button class="btn-del" id="delAll" type="button">

    </button>
  </header>

  <div id="turn"></div>

  <main id="main"></main>
</div>
<div id="dock"></div>
<div id="overlay"></div>

    return accept(parseJSON(obj), src);
  }
  if (ext === 'html' || /<html|<a\s/i.test(t.slice(0, 2000))) return accept(parseHTML(text), src);
  return accept(parseText(text), src);
}

const IGNORE_TOKENS = new Set(['cgtest','official','real','the','und','and','mit','von','der','die','das','im','des','fuer']);
function tokens(u){ return u.split(/[._\d]+/).filter(t => t && !IGNORE_TOKENS.has(t)); }
function hit(u, toks, kw){
  if (TOKEN_ONLY.has(kw)) return toks.includes(kw);

  return !bad || u.replace(new RegExp(bad.join('|'), 'g'), '').includes(kw);

function looksPrivate(u, toks){

}
function classify(u){
  const m = meta(u);
  if (m && m.topic && CAT[m.topic] && m.confidence !== 'niedrig'){
    const hits = [{ cat:m.topic, sub: m.sub && CAT[m.topic].subs[m.sub] ? m.sub : null }];
    for (const c of CATS.filter(c => c.sensitive && c.id !== m.topic)) if (c.kw.some(k => hit(u, tokens(u), k))) hits.push({ cat:c.id, sub:null });
    return { how: m.src === 'claude' ? 'claude' : 'known', hits, meta:m };
  }
  if (KNOWN[u]) return { how:'known', hits: KNOWN[u].map(s => { const [cat, sub] = s.split('/'); return { cat, sub: sub || null }; }) };
  const toks = tokens(u);
  const found = [];
  for (const c of CATS){
    const words = []; const subScore = {};
    for (const k of c.kw) if (hit(u, toks, k)) words.push(k);
    for (const [sid, [, kws]] of Object.entries(c.subs)) for (const k of kws) if (hit(u, toks, k)) { words.push(k); subScore[sid] = (subScore[sid] || 0) + 1; }
    if (words.length){
      const sub = Object.entries(subScore).sort((a, b) => b[1] - a[1])[0]?.[0] || null;
      found.push({ cat:c.id, sub, n:words.length, words, sensitive:!!c.sensitive });
    }
  }
  const sens = found.filter(f => f.sensitive);
  const normal = found.filter(f => !f.sensitive).sort((a, b) => b.n - a.n).slice(0, 2);
  const hits = [...normal, ...sens];

function analyse(p){
  const topics = {}; const unclear = []; const privat = [];
  for (const a of p.accounts){
    if (a.removed) continue;
    const ov = p.overrides[a.u];
    const r = ov ? (ov === 'unclear' ? { how:'unclear', hits:[] } : { how:'manual', hits:[{ cat:ov, sub:null }] }) : classify(a.u);
    if (r.how === 'unclear'){ unclear.push(a.u); continue; }
    if (r.how === 'private'){ privat.push(a.u); continue; }
    for (const h of r.hits) (topics[h.cat] ||= []).push({ u:a.u, how:r.how, sub:h.sub, words:h.words || [], ts:a.ts, meta:r.meta });
  }
  const live = p.accounts.filter(a => !a.removed);
  const total = live.length;
  // Trend: Anteil der Accounts, denen in den letzten 12 Monaten vor dem jüngsten Follow gefolgt wurde
  const stamps = live.map(a => a.ts).filter(Boolean);
  const latest = stamps.length >= 10 ? Math.max(...stamps) : 0;
  const list = Object.entries(topics).map(([id, items]) => {
    const share = items.length / Math.max(total, 1);
    const level = items.length >= 5 && share >= .07 ? 3 : items.length >= 3 ? 2 : 1;
    const subs = {};
    for (const i of items) if (i.sub) subs[i.sub] = (subs[i.sub] || 0) + 1;
    const recent = latest ? items.filter(i => i.ts && i.ts >= latest - 365 * 86400).length : 0;
    const trend = recent >= 2 && recent / items.length >= .4;
    return { id, items, level, share, trend, sensitive: !!CAT[id].sensitive, subs: Object.entries(subs).sort((a, b) => b[1] - a[1]) };
  }).sort((a, b) => b.items.length - a.items.length || a.id.localeCompare(b.id));
  const assigned = new Set(Object.values(topics).flat().map(i => i.u)).size;
  return { list, unclear, privat, total, assigned };
}

- Triff keine Aussagen über die Person, die folgt. Es geht nur um die Accounts.
- "topic": eine dieser IDs: ${ids}.
- "sub": optional eine Unterthemen-ID des Themas (${subs}), sonst null.
- "kind": eine von ${KINDS.join(', ')}.
- "genres": nur bei Musik, höchstens 3, klein geschrieben, z. B. afro house, melodic techno, trance, deutschrap, indie, r&b.
- "group": Kollektiv, Label, Verein oder Liga in Kleinbuchstaben, nur wenn eindeutig bekannt, sonst null.
- "reach": "gross" (weltbekannt), "mittel" oder "nische".
- "name": Anzeigename, falls bekannt, sonst null.
Antworte nur mit JSON in genau dieser Form:
{"items":[{"u":"username","name":null,"kind":"other","topic":null,"sub":null,"genres":[],"group":null,"reach":"nische","confidence":"niedrig"}]}
Usernamen:
${batch.join('\n')}`;
}
function takeClaudeItem(it){
  if (!it || typeof it.u !== 'string') return;
  const u = it.u.replace(/^@/, '').toLowerCase();
  const topic = CAT[it.topic] ? it.topic : null;
  const sub = topic && it.sub && CAT[topic].subs[it.sub] ? it.sub : null;
  ENRICH[u] = { name: typeof it.name === 'string' ? it.name.slice(0, 60) : null, kind: KINDS.includes(it.kind) ? it.kind : 'other', topic, sub,
    genres: Array.isArray(it.genres) ? it.genres.slice(0, 3).map(normGenre).filter(Boolean) : [],
    group: typeof it.group === 'string' && it.group ? it.group.toLowerCase().slice(0, 40) : null,
    reach: ['gross','mittel','nische'].includes(it.reach) ? it.reach : 'nische',
    confidence: ['hoch','mittel','niedrig'].includes(it.confidence) ? it.confidence : 'niedrig', src:'claude' };
}
async function runClaude(){
  const p = P(), sample = await getSample();
  if (!sample){ p.claude = { state:'error', msg:'Claude ist hier nicht verfügbar.' }; return render(); }
  const list = p.accounts.filter(a => !a.removed && classify(a.u).how !== 'private').map(a => a.u);
  const size = 40; p.claude = { state:'running', done:0, total:list.length }; render();
  try {
    for (let i = 0; i < list.length; i += size){
      const batch = list.slice(i, i + size);
      const res = await sample.json(claudePrompt(batch), { modelTier:'default' });
      (res?.items || []).forEach(takeClaudeItem);
      p.claude.done = Math.min(list.length, i + size); render();
    }
    const n = list.filter(u => ENRICH[u]?.topic && ENRICH[u].confidence !== 'niedrig').length;
    p.claude = { state:'done', n, total:list.length }; render(); toast(`Claude hat ${n} Accounts eingeordnet`);
  } catch (err){
    p.claude = { state:'error', msg: err?.code === 'rate_limited' ? 'Gerade zu viele Anfragen. Versuch es in ein paar Minuten nochmal.' : err?.code === 'not_granted' ? 'Du hast Claude nicht erlaubt. Kein Problem, es geht auch ohne.' : 'Das hat nicht geklappt. Versuch es nochmal.' };
    render();
  }
}
function claudeCard(p){
  if (claudeAvail === false || claudeAvail === null) return '';
  const c = p.claude || { state:'idle' };
  if (c.state === 'running') return `<section class="claude-card"><b>Claude ordnet ein …</b><div class="bar"><i style="width:${Math.round(c.done / Math.max(c.total, 1) * 100)}%"></i></div><small class="muted">${c.done} von ${c.total}</small></section>`;
  if (c.state === 'done') return `<section class="claude-card done"><b>Von Claude eingeordnet: ${c.n} Accounts</b><small class="muted">Erkennt Künstler, Genres, Kollektive und Vereine. Du kannst alles korrigieren.</small></section>`;
  return `<section class="claude-card"><b>Genauer mit Claude</b>
    <small class="muted">Claude erkennt Künstler, Genres, Labels und Vereine, z. B. wer zu Keinemusik gehört. Dafür werden deine Usernamen an Claude geschickt, keine anderen Daten. Accounts, die nach Privatpersonen aussehen, bleiben draußen.</small>
    ${c.state === 'error' ? `<div class="alert" role="alert">${esc(c.msg)}</div>` : ''}
    <button class="btn btn-primary" type="button" id="claudeRun">Mit Claude einordnen</button></section>`;
}

function dotsSVG(n, who, animate){
  const R = 60, c = 66, out = [];
  const step = n > 0 ? (R - 4) / Math.sqrt(n) : 0;
  const r = Math.max(1.6, Math.min(5, step * 0.42));
  for (let i = 0; i < n; i++){
    const a = i * 2.39996, d = step * Math.sqrt(i + 0.5);
    const x = (c + d * Math.cos(a)).toFixed(1), y = (c + d * Math.sin(a)).toFixed(1);
    const delay = animate ? ` style="animation-delay:${Math.min(i * 12, 900)}ms"` : '';
    out.push(who === 'A'
      ? `<circle class="d" cx="${x}" cy="${y}" r="${r.toFixed(2)}" fill="var(--accent)"${delay}/>`
      : `<circle class="d" cx="${x}" cy="${y}" r="${(r * .85).toFixed(2)}" fill="none" stroke="var(--accent)" stroke-width="1.2"${delay}/>`);
  }
  return `<svg class="dots${animate ? ' anim' : ''}" viewBox="0 0 132 132" role="img" aria-label="${n} Accounts als Punkte">
    <circle cx="66" cy="66" r="64" fill="var(--accent-soft)" stroke="var(--line)"/>${out.join('')}</svg>`;
}

function reason(i){
  const m = i.meta;
  const extra = m ? [m.genres?.length ? m.genres.map(titleCase).join(', ') : null, m.group ? groupLabel(m.group) : null].filter(Boolean).join(' · ') : '';
  if (i.how === 'claude') return `Claude: ${m.name ? m.name + ' · ' : ''}${extra || (i.sub ? subLabel(i.cat, i.sub) : CAT[i.cat].label)}`;
  if (i.how === 'known') return extra ? `Bekannt · ${extra}` : i.sub ? `Bekannt · ${subLabel(CAT[i.cat] ? i.cat : '', i.sub)}` : 'Bekannt';
  if (i.how === 'manual') return 'Von dir zugeordnet';
  return `Name enthält „${i.words.join('“, „')}“`;
}

  const bars = [1,2,3].map(l => `<span class="seg-bar${l <= t.level ? ' on' : ''}"></span>`).join('');
  const subs = t.subs.length ? `<span class="subs">${t.subs.slice(0, 4).map(([sid, n]) => `<span class="sub">${esc(c.subs[sid][0])} <b>${n}</b></span>`).join('')}${t.subs.length > 4 ? `<span class="sub">+${t.subs.length - 4}</span>` : ''}</span>` : '';
  const items = open ? `<ul class="acc">${[...t.items].sort((a,b)=>a.u.localeCompare(b.u)).map(i => `<li><div class="acc-u"><span>@${esc(i.u)}</span><small>${esc(reason({...i, cat:t.id}))}</small></div>${moveSelect(i.u, t.id)}</li>`).join('')}</ul>` : '';
  return `<li class="topic${t.sensitive ? ' sens' : ''}" style="--i:${idx}">${art(t.id)}
    <button class="topic-head" type="button" data-topic="${t.id}" aria-expanded="${open}">
      <span class="ticon">${icon(t.sensitive ? 'lock' : t.id)}</span>
      <span class="tmain"><span class="ttitle">${esc(c.label)}</span>

        <span class="strength" aria-label="Stärke: ${LEVEL[t.level]}">${bars}<em>${LEVEL[t.level]}</em></span></span>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      ${subs}

}

function itemsOf(sum){
  const out = [];
  for (const t of sum.topics){
    out.push({ tok:'t:' + t.id, det:[t.share, t.level, t.trend ? 1 : 0, t.nSubs] });
    for (const [s, n] of t.subs) out.push({ tok:`s:${t.id}/${s}`, det:[n] });
  }
  for (const u of sum.accounts) out.push({ tok:'a:' + u, det:[] });
  const edges = new Set(), fams = new Set();
  for (const [g, n] of sum.genres){ out.push({ tok:'g:' + g, det:[n] }); edgesOf(g).forEach(e => edges.add(e)); familiesOf(g).forEach(f => fams.add(f)); }
  edges.forEach(e => out.push({ tok:'e:' + e, det:[] }));
  fams.forEach(f => out.push({ tok:'f:' + f, det:[] }));
  for (const [c, n] of sum.groups) out.push({ tok:'c:' + c, det:[n] });
  return out;
}
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--){ const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* Kodierung für Links: JSON -> deflate -> Base32 (nur a-z und 2-7, damit es im Link-Anker funktioniert) */
const B32 = 'abcdefghijklmnopqrstuvwxyz234567';
function toB32(bytes){ let bits = 0, val = 0, out = ''; for (const b of bytes){ val = (val << 8) | b; bits += 8; while (bits >= 5){ out += B32[(val >>> (bits - 5)) & 31]; bits -= 5; } val &= (1 << bits) - 1; } if (bits > 0) out += B32[(val << (5 - bits)) & 31]; return out; }
function fromB32(str){ let bits = 0, val = 0; const out = []; for (const ch of str){ const i = B32.indexOf(ch); if (i < 0) throw new Error('Zeichen'); val = (val << 5) | i; bits += 5; if (bits >= 8){ out.push((val >>> (bits - 8)) & 255); bits -= 8; } val &= (1 << bits) - 1; } return new Uint8Array(out); }
async function pack(obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if ('CompressionStream' in window){ try { const s = new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw')); return 'z' + toB32(new Uint8Array(await new Response(s).arrayBuffer())); } catch {} }
  return 'u' + toB32(raw);
}
async function unpack(code){
  let bytes = fromB32(code.slice(1));
  if (code[0] === 'z'){ const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')); bytes = new Uint8Array(await new Response(s).arrayBuffer()); }
  else if (code[0] !== 'u') throw new Error('Format');
  return JSON.parse(new TextDecoder().decode(bytes));
}

async function makeInvite(){

  const x = items.map(it => [toB32(PSI.blind(it.tok, s)), it.det]);
  saveSession(sid, { created:Date.now(), s:PSI.sToHex(s), toks:items.map(i => i.tok), dets:items.map(i => i.det), sum:a, rel:state.rel, city:state.city.trim() });

async function makeAnswer(){

  const x2 = r.x.map(([pt]) => toB32(PSI.reblind(fromB32(pt), s).slice(0, TRUNC)));

function intersectAnswer(sess, ans){
  const s = PSI.hexToS(sess.s), mine = new Map();
  for (const [pt, det] of ans.y) mine.set(toB32(PSI.reblind(fromB32(pt), s).slice(0, TRUNC)), det);

}

function resultFrom(common, ctx){
  const TA = new Map(), TB = new Map(), matches = [], genres = [], edges = [], fams = [], groups = [];
  for (const [tok, [dA, dB]] of common){
    const [kind, rest] = [tok.slice(0, 1), tok.slice(2)];
    if (kind === 't' && CAT[rest]){
      TA.set(rest, { id:rest, share:dA[0], level:dA[1], trend:!!dA[2], nSubs:dA[3] || 0, subs:[], mode:'gemeinsam' });
      TB.set(rest, { id:rest, share:dB[0], level:dB[1], trend:!!dB[2], nSubs:dB[3] || 0, subs:[], mode:'gemeinsam' });
    }
  }
  for (const [tok, [dA, dB]] of common){
    const kind = tok.slice(0, 1), rest = tok.slice(2);
    if (kind === 's'){ const [id, sub] = rest.split('/'); TA.get(id)?.subs.push([sub, dA[0]]); TB.get(id)?.subs.push([sub, dB[0]]); }
    if (kind === 'a') matches.push(rest);
    if (kind === 'g') genres.push([rest, dA[0], dB[0]]);
    if (kind === 'e') edges.push(rest);
    if (kind === 'f') fams.push(rest);
    if (kind === 'c') groups.push([rest, dA[0], dB[0]]);
  }
  const gset = new Set(genres.map(g => g[0]));
  // Nur echte Nachbarschaft: keines der beiden Genres teilt ihr schon direkt
  const nearEdges = edges.map(e => e.split('|')).filter(([x, y]) => !gset.has(x) && !gset.has(y));
  for (const t of decTopics(ctx.immA)) if (!TA.has(t.id)) TA.set(t.id, t);
  for (const t of decTopics(ctx.immB)) if (!TB.has(t.id)) TB.set(t.id, t);
  const info = ctx.info || {};
  return { nameA:ctx.nameA || 'Person 1', nameB:ctx.nameB || 'Person 2', genderA:ctx.genderA || null, genderB:ctx.genderB || null, rel:ctx.rel || null, city:ctx.city || '',
    topicsA:[...TA.values()], topicsB:[...TB.values()], totals:{ A:ctx.ttA || 0, B:ctx.ttB || 0 },
    matches:matches.sort(), matchInfo:Object.fromEntries(matches.map(u => [u, info[u] || [null, null, null]])),
    music:{ genres:genres.sort((x, y) => (y[1] + y[2]) - (x[1] + x[2])), near:nearEdges, fams, groups } };
}
async function makeResultLink(){
  return appUrl() + '#ergebnis-' + await pack({ k:'r', v:2, d:state.result });
}
async function openCode(input){
  let s = String(input || '').trim();
  if (s.includes('#')) s = s.slice(s.indexOf('#') + 1);
  s = s.replace(/\s+/g, '').toLowerCase();
  const m = s.match(/^(einladung|antwort|ergebnis)-([a-z2-7]+)$/);
  if (!m) throw new Error('kein Code');
  const d = await unpack(m[2]);
  if (m[1] === 'einladung' && d.k === 'i' && d.v === 2){
    state = fresh(); state.mode = 'link'; state.active = 'B';
    state.remote = d; state.inviteCode = s; state.rel = d.r || null; state.city = d.c || '';
    state.persons.A.name = d.n || ''; state.screen = 'consent';
  } else if (m[1] === 'antwort' && d.k === 'a' && d.v === 2){
    const sess = getSession(d.sid);
    if (!sess) throw new Error('keine Sitzung');
    const common = intersectAnswer(sess, d);
    state = fresh(); state.mode = 'link';
    state.result = resultFrom(common, { nameA:sess.sum.name, nameB:d.n, genderA:sess.sum.gender, genderB:d.g, rel:sess.rel, city:sess.city, immA:immerOf(sess.sum), immB:d.imm, ttA:sess.sum.total, ttB:d.tt, info:sess.sum.info });
    state.result.sendBack = true;
    dropSession(d.sid);
    state.screen = 'result';
    makeResultLink().then(l => { state.replyLink = l; if (state.screen === 'result') render(); });
  } else if (m[1] === 'ergebnis' && d.k === 'r' && d.v === 2){
    state = fresh(); state.mode = 'link'; state.result = { ...d.d, sendBack:false }; state.screen = 'result';
  } else throw new Error('Format');
}
async function finishB(){
  const b = state.persons.B.summary;
  if (state.mode === 'link'){ state.answerLink = null; go('answer'); state.answerLink = await makeAnswer(); if (state.screen === 'answer') render(); return; }
  const a = state.persons.A.summary;
  state.result = resultFrom(plainIntersect(a, b), { nameA:a.name, nameB:b.name, genderA:a.gender, genderB:b.gender, rel:state.rel, city:state.city.trim(), immA:immerOf(a), immB:immerOf(b), ttA:a.total, ttB:b.total, info:{ ...a.info, ...b.info } });
  go('result');
}

/* ---------- Analyse-Engine v2 (Schritt 5) ----------
   Ebenen: 1) gemeinsame Accounts, gewichtet nach Seltenheit  2) gemeinsame Unterthemen
           3) gemeinsame Themen, gewichtet nach Anteil an der Liste  4) Brücken zwischen verwandten Themen
           5) Trends (frisch gefolgte Themen). Daraus: Ranking, Einstiege, Date-Ideen und ein erklärbarer Index. */
const W_KNOWN = .35, W_NICHE = 1, W_OTHER = .8;
// Gewicht eines gemeinsamen Accounts nach Bekanntheit: weltbekannt .35, mittel .7, Nische 1
function accountInfo(u, info){
  const r = classify(u), [name, kind, reach] = info?.[u] || [];
  const rc = reach || meta(u)?.reach || (r.how === 'known' ? 'gross' : r.how === 'keyword' ? 'nische' : null);
  const w = rc === 'gross' ? W_KNOWN : rc === 'mittel' ? .7 : rc === 'nische' ? W_NICHE : W_OTHER;
  const k = kind || meta(u)?.kind || null;
  return { u, name: name || meta(u)?.name || null, kind:k, cats: r.hits.map(h => h.cat), w, known: rc === 'gross', artist: ARTIST_KINDS.has(k) };
}
const RELATED = [
  ['natur','reisen','Welcher Ort verbindet Natur und Fernweh für euch?'],
  ['food','reisen','Für welches Land würdet ihr nur wegen des Essens verreisen?'],
  ['sport','natur','Welcher Sport macht draußen am meisten Spaß?'],
  ['kunst','architektur','Welches Gebäude ist für euch eigentlich ein Kunstwerk?'],
  ['kunst','foto','Welches Bild hättet ihr gern selbst gemacht?'],
  ['tech','gaming','Welche Technik hat Spiele für euch am meisten verändert?'],
  ['mode','kunst','Ist Mode für euch Kunst oder einfach Kleidung?'],
  ['handwerk','kunst','Wo hört Handwerk auf und wo fängt Kunst an?'],
  ['food','handwerk','Was würdet ihr gern mal zusammen selbst machen?'],
  ['musik','film','Welcher Soundtrack ist besser als sein Film?'],
  ['buecher','film','Welche Verfilmung ist besser als das Buch?'],
  ['humor','film','Welche Komödie geht immer?'],

  ['musik','reisen','Für welches Konzert würdet ihr ins Ausland fahren?'],
  ['news','tech','Welche Tech-Nachricht hat euch zuletzt überrascht?'],
  ['bildung','buecher','Welches Buch hat euch mehr beigebracht als die Schule?'],
  ['reisen','natur','Welche Region würdet ihr zum Wandern als Nächstes ausprobieren?'],
  ['buecher','news','Was lest ihr lieber: Bücher oder Magazine?'],
];
function analysis(d){
  const A = new Map(d.topicsA.map(t => [t.id, t])), B = new Map(d.topicsB.map(t => [t.id, t]));
  const acc = d.matches.map(u => accountInfo(u, d.matchInfo)).sort((x, y) => y.w - x.w || x.u.localeCompare(y.u));
  const shared = [];
  for (const [id, a] of A){
    if (!B.has(id)) continue;
    const b = B.get(id), sa = new Map(a.subs), sb = new Map(b.subs);
    const subsShared = [...sa.keys()].filter(s => sb.has(s)).sort((x, y) => (sa.get(y) + sb.get(y)) - (sa.get(x) + sb.get(x)));
    const accs = acc.filter(x => x.cats.includes(id));
    const depth = Math.min(a.share, b.share) || Math.min(a.level, b.level) * 3;
    const bothTrend = a.trend && b.trend;
    const score = depth * (1 + .5 * subsShared.length) + accs.reduce((s, x) => s + x.w * 4, 0) + (bothTrend ? 6 : 0);
    shared.push({ id, a, b, subsShared, subsOnlyA:[...sa.keys()].filter(s => !sb.has(s)), subsOnlyB:[...sb.keys()].filter(s => !sa.has(s)), accs, score, bothTrend });
  }
  shared.sort((x, y) => y.score - x.score);
  const vis = (m, id) => m.get(id)?.mode === 'immer';
  const onlyA = [...A.values()].filter(t => !B.has(t.id) && t.mode === 'immer').sort((x, y) => y.share - x.share);
  const onlyB = [...B.values()].filter(t => !A.has(t.id) && t.mode === 'immer').sort((x, y) => y.share - x.share);
  // Brücken nur aus Themen, die die jeweilige Person auf "Immer" gestellt hat
  const bridges = [];
  for (const [x, y, q] of RELATED){
    if (vis(A, x) && vis(B, y) && !B.has(x) && !A.has(y)) bridges.push({ a:x, b:y, q });
    else if (vis(A, y) && vis(B, x) && !B.has(y) && !A.has(x)) bridges.push({ a:y, b:x, q });
  }
  // Index aus vier erklärbaren Teilen
  // Themen: Summe der kleineren Anteile geteilt durch die Summe der größeren. Nicht sichtbare Themen fließen nur als Gesamtsumme ein.
  let mn = 0, mx = 0, sumA = 0, sumB = 0;
  for (const s of shared){ mn += Math.min(s.a.share, s.b.share); mx += Math.max(s.a.share, s.b.share); sumA += s.a.share; sumB += s.b.share; }
  const restA = Math.max(0, (d.totals?.A || [...A.values()].reduce((x, t) => x + t.share, 0)) - sumA);
  const restB = Math.max(0, (d.totals?.B || [...B.values()].reduce((x, t) => x + t.share, 0)) - sumB);
  mx += restA + restB;
  const topicSim = mx ? mn / mx : 0;
  let sShared = 0, sUnion = 0;
  for (const s of shared){ const k = s.subsShared.length; sShared += k; sUnion += Math.max(k, (s.a.nSubs || s.a.subs.length) + (s.b.nSubs || s.b.subs.length) - k); }
  const subSim = sUnion ? sShared / sUnion : 0;
  const accSim = 1 - Math.exp(-acc.reduce((s, x) => s + x.w, 0) / 4);
  const bridgeSim = Math.min(1, bridges.length / 3);
  // Musik in Stufen: gleicher Künstler > gleiches Kollektiv/Label > gleiches Genre > Nachbar-Genre > gleiche Richtung
  const mu = d.music || { genres:[], near:[], fams:[], groups:[] };
  const artists = acc.filter(x => x.artist);
  const musicRaw = artists.length * 1 + mu.groups.length * .8 + mu.genres.length * .6 + mu.near.length * .35 + mu.fams.length * .15;
  const hasMusic = musicRaw > 0;
  const musicSim = 1 - Math.exp(-musicRaw / 2);
  const parts = hasMusic ? [
    { key:'Themen', v:topicSim, w:.4, hint:'Wie ähnlich eure Abos auf die Themen verteilt sind' },
    { key:'Unterthemen', v:subSim, w:.2, hint:'Wie oft ihr auch im Detail übereinstimmt, z. B. Fußball statt nur Sport' },
    { key:'Accounts', v:accSim, w:.2, hint:'Gemeinsame Accounts. Seltene zählen mehr als sehr bekannte' },
    { key:'Musik', v:musicSim, w:.1, hint:'Gleiche Künstler, Kollektive, Genres und verwandte Genres' },
    { key:'Brücken', v:bridgeSim, w:.1, hint:'Verwandte Themen, die euch verbinden, z. B. Wandern und Reisen' },
  ] : [
    { key:'Themen', v:topicSim, w:.45, hint:'Wie ähnlich eure Abos auf die Themen verteilt sind' },
    { key:'Unterthemen', v:subSim, w:.25, hint:'Wie oft ihr auch im Detail übereinstimmt, z. B. Fußball statt nur Sport' },
    { key:'Accounts', v:accSim, w:.2, hint:'Gemeinsame Accounts. Seltene zählen mehr als sehr bekannte' },
    { key:'Brücken', v:bridgeSim, w:.1, hint:'Verwandte Themen, die euch verbinden, z. B. Wandern und Reisen' },
  ];
  const index = Math.round(100 * parts.reduce((s, p) => s + p.v * p.w, 0));
  return { shared, onlyA, onlyB, bridges, acc, parts, index, music:{ ...mu, artists }, hasMusic };
}

    if (art) out.push(`Ihr folgt beide ${art.name || '@' + art.u}. Welcher Track von ${art.name || 'ihnen'} läuft bei dir am meisten?`);
    else if (mu.groups[0]) out.push(`Ihr folgt beide Leuten aus dem Umfeld von ${groupLabel(mu.groups[0][0])}. Welches Set war dein bestes?`);
    if (mu.genres[0]) out.push(`Was war der erste ${titleCase(mu.genres[0][0])}-Track, der bei dir hängen geblieben ist?`);
  }
  const acc = st.accs.find(x => !x.known) || st.accs[0];
  if (acc && out.length < 2) out.push(acc.known ? `Ihr folgt beide @${acc.u}. Was gefällt dir daran?` : `Ihr folgt beide @${acc.u}. Wie bist du darauf gestoßen?`);
  for (const s of st.subsShared){ if (out.length >= 3) break; if (S.s[s]) out.push(S.s[s]); }

  return out.slice(0, 3);
}

function dateIdeas(an, d, tone){
  const rank = new Map(an.shared.map((s, i) => [s.id, 1 + (1 - i / Math.max(an.shared.length, 1))]));
  const subs = new Set(an.shared.flatMap(s => s.subsShared.map(x => s.id + '/' + x)));
  const bridgeIds = new Set(an.bridges.flatMap(b => [b.a, b.b]));
  const wo = d.city ? `in ${d.city}` : 'in eurer Nähe';
  const first = tone === 'date' || tone === 'fremde';
  const scored = IDEAS.filter(i => !(first && (i.home || i.notFirst))).map(i => {
    const hits = []; const why = [];
    for (const t of i.topics){ if (rank.has(t)){ hits.push(rank.get(t)); why.push(CAT[t].label); } else if (bridgeIds.has(t)) hits.push(.4); }
    hits.sort((a, b) => b - a);
    let score = (hits[0] || 0) + .3 * hits.slice(1).reduce((a, b) => a + b, 0);
    const subHit = i.sub && i.topics[0] && subs.has(i.topics[0] + '/' + i.sub);
    if (subHit){ score += 2; why.unshift(CAT[i.topics[0]].subs[i.sub][0]); }
    return { ...i, d:i.d.replace('{wo}', wo), score, why:[...new Set(why)].slice(0, 2) };
  }).sort((a, b) => b.score - a.score);
  const out = [], perMood = {};
  const live = an.music?.artists?.[0] || (an.music?.groups?.[0] && { name: groupLabel(an.music.groups[0][0]) });
  if (live){ const nm = live.name || '@' + live.u; out.push({ t:`${nm} live sehen`, d:`Schaut, ob ${nm} bald ${wo} oder in der Nähe spielt. Vorher zusammen die Lieblingstracks hören.`, mood:'kulturell', dur:'Abend', cost:'€€', why:['Musik'], score:9 }); perMood.kulturell = 1; }
  for (const i of scored){
    if (out.length >= 6) break;
    if (i.score <= 0 && out.length >= 3) break;
    if ((perMood[i.mood] || 0) >= 2) continue;
    perMood[i.mood] = (perMood[i.mood] || 0) + 1; out.push(i);
  }
  return out;
}
